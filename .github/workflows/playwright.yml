name: Playwright Tests

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

jobs:
    typecheck:
        timeout-minutes: 10
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v7

            - uses: actions/setup-node@v7
              with:
                node-version: lts/*
                cache: npm

            - name: Install dependencies
              run: npm ci

            - name: Create environment file
              run: cp .env.example .env

            - name: Check types
              run: npm run typecheck

    api-tests:
        timeout-minutes: 30
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v7

            - uses: actions/setup-node@v7
              with:
                node-version: lts/*
                cache: npm

            - name: Install dependencies
              run: npm ci

            - name: Create environment file
              run: cp .env.example .env

            - name: Run API Playwright tests
              run: npx playwright test --project=api

    ui-tests:
        timeout-minutes: 30
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v7

            - uses: actions/setup-node@v7
              with:
                node-version: lts/*
                cache: npm

            - name: Install dependencies
              run: npm ci

            - name: Create environment file
              run: cp .env.example .env

            - name: Install Chrome for UI tests
              run: npx playwright install --with-deps chromium

            - name: Run UI Playwright tests
              run: npx playwright test --project=ui

            - name: Upload UI failure results
              uses: actions/upload-artifact@v4
              if: failure()
              with:
                    name: ui-test-results
                    path: test-results/
                    retention-days: 30
